name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Set up V
        uses: vlang/setup-v@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-preact/package-lock.json

      - name: Check dependencies
        run: bash tools/check-deps.sh

      - name: Run frontend checks and backend tests
        run: v run build.vsh test

      - name: Build desktop app
        run: v run build.vsh
